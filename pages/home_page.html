<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>capstone_home page</title>
    <link rel="stylesheet" href="../src/css/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
    <header>
        <div class="nav">
            <div class="logo">
                <a href="home_page.html">
                    <img src="../images/logo.png" alt="Logo" style="width: 75px; height: 75px;">
                </a>
            </div>
            <div class="links">
                <ul class="items-links">
                    <li><a href="home_page.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="requests.html">Requests</a></li>
                </ul>
            </div>
        </div>
    </header>
    <section class="main-section" >
        <div class="container d-flex justify-content-center" >
            <div class="home-content">
                <h2 class="text-center " style=" margin: 20px 0;">Welcome To The Capstone Team Manager</h2>
                <p class="text-center " style=" margin-bottom: 20px;">Before Each Semester, We Form a Team For The Capstone 
                    Project, so We Built This Website to Manage it and Make it Easier to Manage
                     Data and Find the Team Members.
                </p>

                <div class="home-btn">
                    <div class="btn create">Create Team</div>
                    <div class="btn join">Join Team</div>
                </div>
            </div>
           
        </div>
            
        
    </section>


<section class="status-team"> 
    <div class="container d-flex justify-content-center"> 
        <div class="status"> 

            <h4 style="margin: 40px 0;">Team Status</h4> 

            <div class="members"> 
                <h6>Members</h6> 

                <div class="team"> 

                    <div class="both"> 
                        <label for="member1">Member Name:</label> 
                        <input class="inp" type="text" id="member1" name="member1" value="Team 1" readonly> 
                    </div> 

                    <div class="both"> 
                        <label for="member2">Member Name:</label> 
                        <input class="inp" type="text" id="member2" name="member2" value="Team 2" readonly> 
                    </div> 

                    <div class="both"> 
                        <label for="member3">Member Name:</label> 
                        <input class="inp" type="text" id="member3" name="member3" value="Team 3" readonly> 
                    </div> 

                    <div class="both"> 
                        <label for="member4">Member Name:</label> 
                        <input class="inp" type="text" id="member4" name="member4" value="Team 4" readonly> 
                    </div> 

                    <div class="both"> 
                        <label for="member5">Member Name:</label> 
                        <input class="inp" type="text" id="member5" name="member5" value="Team 5" readonly> 
                    </div> 

                </div>

                <div class="contact-lead"> 
                    <label for="contact">Contact Lead (WhatsApp):</label> 
                    <input class="inp" type="text" id="contact" name="contact" value="1234567890" readonly> 
                </div>  

            </div> 
        </div> 
    </div> 
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
