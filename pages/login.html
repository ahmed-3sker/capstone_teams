<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/output.css">
    <title>Capstone Manager</title>
</head>

<!--
the color palette
blue: #2185D5
gray: #3A4750
dark gray: #303841
white: #F3F3F3
-->
<body class="w-screen min-h-screen bg-[#303841] m-0">
    <div class="flex flex-row min-h-screen  w-full  ">
        <div class="w-1/2 px-20 py-10 relative">
            <header class=" flex flex-row items-center gap-3">
                <img src="../images/logo.png" alt="stem october logo" class="w-25 h-25">
                <div class="flex flex-col">
                    <p class=" font-bold text-3xl text-[#2185D5] ">STEM October</p>
                    <p class="text-sm text-[#f3f3f3] tracking-widest">CAPSTONE MANAGER</p>
                </div>
            </header>
        </div>
        <div class="w-1/2 flex items-center justify-center">
            <div>
                <form>
                    <h3 class="">Login & Signup</h3>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <a href="forget.html">Forget Password?</a>
                    <a href="signup.html">Don't have an account? Sign Up Here</a>
                    <button type="submit" id="Login" >Login</button>
                </form>
            </div>
        </div>
        
    </div>
    <script src="../src/js/login.js" defer></script>
</body>
</html>
