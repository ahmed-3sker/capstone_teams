<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/output.css">
    <title>Capstone Manager</title>
</head>
<body class="w-screen min-h-screen bg-[#303841] m-0 text-[#f3f3f3]">
    <div class="flex flex-row min-h-screen  w-full  ">
        <div class="w-1-2">
            <h1>Welcome To STEM October Capstone Manager</h1>
            <img src="" alt="stem october logo">
        </div>
        <div class="w-1/2">
            <form>
                <h3 class="">Login & Signup</h3>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <a href="forget.html">Forget Password?</a>
                <a href="signup.html">Don't have an account? Sign Up Here</a>
                <button type="submit" id="Login" >Login</button>
            </form>
        </div>
        
    </div>
    <script src="../src/js/login.js" defer></script>
</body>
</html>
