<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/output.css">
    <title>Capstone Manager</title>
</head>

<!--
the color palette
blue: #2185D5
gray: #111923
dark gray: #303841
white: #F3F3F3
-->
<body class="w-screen min-h-screen bg-linear-to-r from-[#111923] to-[#1a2634] m-0">
    <div class=" absolute -top-24 -right-24 w-80 h-80 bg-blue-500/20 rounded-full blur-3xl pointer-events-none "></div>
    <div class=" h-80 w-80 absolute -left-24 -bottom-24 blur-3xl bg-blue-600/20 rounded-full pointer-events-none"></div>
    <div class="flex flex-row min-h-screen  w-full  ">
        <div class="w-1/2 px-20 py-10 relative">
            <header class=" flex flex-row items-center gap-3 mb-30">
                <img src="../images/logo.png" alt="stem october logo" class="w-25 h-25">
                <div class="flex flex-col">
                    <p class=" font-bold text-3xl text-[#2185D5] ">STEM October</p>
                    <p class="text-sm text-[#f3f3f3] tracking-widest font-semibold">CAPSTONE MANAGER</p>
                </div>
            </header>
            <h2 class="text-5xl text-[#f3f3f3] ">Welcome To</h2>
            <h1 class="text-6xl text-[#f3f3f3]">Capstone <span class="text-[#2185D5] font-bold">Manager</span></h1>

        </div>
        <div class="w-1/2 flex items-center justify-center">
            <div>
                <form>
                    <h3 class="">Login & Signup</h3>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <a href="forget.html">Forget Password?</a>
                    <a href="signup.html">Don't have an account? Sign Up Here</a>
                    <button type="submit" id="Login" >Login</button>
                </form>
            </div>
        </div>
        
    </div>
    <script src="../src/js/login.js" defer></script>
</body>
</html>
